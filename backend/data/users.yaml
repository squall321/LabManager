#   is_admin:       계정/시스템 관리자 여부 (true/false, 기본 false)
#   is_part_leader: 랩장(파트장) 여부 — 익명 집계만 조회 (admin과 독립, 기본 false)
#   department:     소속 (디지털트윈AX랩)

