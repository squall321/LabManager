# 디지털트윈AX랩 - 사용자 계정 설정
# 이 파일에 이름과 이메일을 추가하면 시스템 시작 시 자동으로 계정이 생성됩니다.
# 모든 구성원은 디지털트윈AX랩 소속입니다. 최초 로그인 시 본인이 비밀번호를 설정합니다.
